services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    # -------- Both of the following commands should be commented to run with nginx --------

    # -------- replace with comment to run with gunicorn --------
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    env_file:
      - ./src/.env
    # -------- replace with expose if you are using nginx --------
    ports:
       - "8000:8000"
    # expose:
    #    - "8000"
    depends_on:
      - db
    volumes:
      - ./src/app:/app/src/app
      - ./src/.env:/app/.env


  db:
    image: postgres:16-alpine
    env_file:
      - ./src/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"

  #-------- uncomment to run with nginx --------
  # nginx:
  #   image: nginx:latest
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./default.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - web

  #-------- uncomment to run tests --------
  pytest:
    build: 
      context: .
      dockerfile: Dockerfile 
    env_file:
      - ./src/.env
    depends_on:
      - db
    command: pytest tests
    # command: debugpy --listen 0.0.0.0:5678 --wait-for-client -m pytest tests
    # ports:
    #   - 5678:5678
    volumes:
      - ./src/app:/app/src/app
      - ./tests:/app/tests
      - ./src/.env:/app/.env

  #-------- uncomment to create first tier --------
  # create_tier:
  #   build: 
  #     context: .
  #     dockerfile: Dockerfile
  #   env_file:
  #     - ./src/.env
  #   depends_on:
  #     - create_superuser
  #     - db
  #     - web
  #   command: python -m src.scripts.create_first_tier
  #   volumes:
  #     - ./src:/code/src

volumes:
  postgres-data:
  redis-data:
 
